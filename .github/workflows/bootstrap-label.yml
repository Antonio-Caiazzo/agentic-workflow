# One-time bootstrap for the test label; does not invoke any AI model.
name: Bootstrap diagnostic label
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-label.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-label:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Create fase:piano if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "fase:piano" \
            --repo "$GITHUB_REPOSITORY" \
            --color "FBCA04" \
            --description "Avvia il Pianificatore per il test diagnostico" \
            --force
