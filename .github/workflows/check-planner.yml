name: CI - Check direct planner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  planner-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python syntax and deterministic guardrails
        run: |
          python3 -m compileall -q .github/scripts
          python3 .github/scripts/test_plan.py
      - name: YAML parse
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.parse_file(f); puts "OK #{f}" }'
      - name: Diff whitespace
        run: git diff --check origin/main...HEAD
